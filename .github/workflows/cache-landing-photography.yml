name: Cache verified landing photography

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download verified photographs
        run: node scripts/download-landing-photos.mjs

      - name: Commit photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/landing
          if git diff --cached --quiet; then
            echo "No photo changes."
          else
            git commit -m "chore: cache verified landing photographs"
            git push
          fi
